services:
  geocoder:
    image: mediagis/nominatim:4.5
    container_name: huashe-nanjing-geocoder
    restart: unless-stopped
    ports:
      - "127.0.0.1:7070:8080"
    environment:
      PBF_PATH: /nominatim/nanjing.osm.pbf
      NOMINATIM_PASSWORD: change-this-before-production
      IMPORT_WIKIPEDIA: "false"
      IMPORT_US_POSTCODES: "false"
    volumes:
      - ./data/nanjing.osm.pbf:/nominatim/nanjing.osm.pbf:ro
      - ./nominatim-data:/var/lib/postgresql/14/main

  tiles:
    image: maptiler/tileserver-gl:v4.12.1
    container_name: huashe-nanjing-map
    restart: unless-stopped
    command: -p 8080 /data/nanjing.mbtiles
    ports:
      - "127.0.0.1:7071:8080"
    volumes:
      - ./data/nanjing.mbtiles:/data/nanjing.mbtiles:ro
